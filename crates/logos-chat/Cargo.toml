[package]
name = "logos-chat"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# LogosConfig's GroupV3 timing override, for tests and demos that can't wait out the commit
# finalize delay.
test-support = ["logos-generic-chat/test-support"]

[dependencies]
# Workspace dependencies (sorted)
components = { workspace = true }
crossbeam-channel = { workspace = true }
embedded-logos-delivery = { workspace = true }
libchat = { workspace = true }
logos-account = { workspace = true }
logos-generic-chat = { workspace = true }

