[package]
name = "logos-generic-chat"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# The GroupV3 timing override, for tests and demos that can't wait out the commit finalize delay.
test-support = []

[dependencies]
# Workspace dependencies (sorted)
chat-sqlite = { workspace = true }
components = { workspace = true }
crossbeam-channel = { workspace = true }
crypto = { workspace = true }
libchat = { workspace = true }
logos-account = { workspace = true }

# External dependencies (sorted)
hex = "0.4.3"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# Workspace dependencies (sorted)
integration_tests_core = { workspace = true }
# Itself, so its own tests get test-support.
logos-generic-chat = { workspace = true, features = ["test-support"] }

# External dependencies (sorted)
tempfile = "3"
