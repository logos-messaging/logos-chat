[package]
name = "libchat"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# The in-memory store, for crates that test against one.
test-support = []

[dependencies]
# Workspace dependencies (sorted)
blake2 = { workspace = true }
crypto = { workspace = true }
shared-traits = { workspace = true }

# External dependencies (sorted)
alloy = "2.0"
base64 = "0.22"
chat-proto = { workspace = true }
de-mls = { git = "https://github.com/vacp2p/de-mls", rev = "4d85a02" }
hashgraph-like-consensus = "0.6.0"
hex = "0.4.3"
openmls = { version = "0.8.1", features = ["libcrux-provider"] }
openmls_libcrux_crypto = "0.3.1"
openmls_memory_storage = "0.5.0"
openmls_traits = "0.5.0"
prost = "0.14.1"
rand = "0.9"
rand_core = { version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1.44"
x25519-dalek = { version = "2.0.1", features = [
    "static_secrets",
    "reusable_secrets",
    "getrandom",
] }

[dev-dependencies]
# External dependencies (sorted)
tempfile = "3"
