[package]
name = "crypto"
version = "0.1.0"
edition = "2024"
# Spelled out rather than inherited: `account-log` depends on this crate and
# must resolve without a workspace root above it.
license = "MIT OR Apache-2.0"

[dependencies]
# External dependencies (sorted)
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
generic-array = "1.3.5"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xeddsa = "=1.0.2"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
# External dependencies (sorted)
hex = "0.4.3"
