# cargo-deny configuration — run with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# libcrux crypto crates arrive under openmls, exact-pinned (a 0.0.x requirement
# matches only that version), so cargo update cannot move them. openmls 0.9
# does not help — it still resolves to a vulnerable libcrux-kem.
# Revisit when an openmls release resolves to libcrux-kem >= 0.0.10.
ignore = [
    "RUSTSEC-2026-0073", # libcrux-poly1305
    "RUSTSEC-2026-0075", # libcrux-ed25519
    "RUSTSEC-2026-0124", # libcrux-chacha20poly1305
    "RUSTSEC-2026-0207", # libcrux-sha3
    "RUSTSEC-2026-0208", # libcrux-sha3
    "RUSTSEC-2026-0212", # libcrux-secrets
    "RUSTSEC-2026-0209", # libcrux-aesgcm — AES-GCM, unused by our ciphersuite
    "RUSTSEC-2026-0211", # libcrux-aesgcm — AES-GCM, unused by our ciphersuite
    "RUSTSEC-2026-0210", # libcrux-aesgcm renamed
    "RUSTSEC-2026-0330", # libcrux-kem — encapsulate_derand, never called
    "RUSTSEC-2026-0331", # libcrux-kem — reachable: short init_key panics
    "RUSTSEC-2024-0436", # paste, unmaintained
    "RUSTSEC-2026-0173", # proc-macro-error2, unmaintained
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 via alloy (GroupV2 + de-mls); patched 0.7 needs alloy on k256 0.14.
]
# RUSTSEC-2026-0459 (SQLite WAL uninitialized memory) clears by version range,
# but libsqlite3-sys 0.39's bundled-sqlcipher build pins sqlcipher-src
# =419.0.6, which still bundles SQLite 3.53.4. The fix is in SQLite 3.54.
# Revisit when libsqlite3-sys depends on sqlcipher-src >= 420.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# sqlcipher-src is the bundled SQLCipher source behind rusqlite's
# bundled-sqlcipher feature. Its license field names the SQLite blessing
# (public domain) and WTFPL alongside MIT and BSD-3-Clause.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

# chat-proto ships no license field yet; treat it as the workspace license.
[[licenses.clarify]]
crate = "chat-proto"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/logos-messaging/chat_proto",
    "https://github.com/logos-messaging/logos-delivery-rust-bindings",
    "https://github.com/logos-messaging/sds-rs",
    "https://github.com/vacp2p/de-mls",
]
