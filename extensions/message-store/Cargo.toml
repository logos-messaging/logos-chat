[package]
name = "message-store"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "A default store for chat messages, over a SQLite connection the application opens"

[dependencies]
# External dependencies (sorted)
# No SQLite build features: the application picks the SQLite build it links.
# fallible_uint restores the `usize` conversions rusqlite 0.35 had built in.
rusqlite = { version = "0.41.1", features = ["fallible_uint"] }

[dev-dependencies]
# External dependencies (sorted)
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = "3"
