[package]
name = "account-log"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Append-only signed account log: entries, invariants, and canonical encoding."

# No `workspace = true` inheritance anywhere in this manifest, so the crate
# resolves standalone. Lifting it out now carries `crypto` with it: that crate
# owns the Ed25519 types.
[dependencies]
crypto = { path = "../../core/crypto" }
hex = "0.4.3"
thiserror = "2"

