[package]
name = "account-log"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Append-only signed account log: entries, invariants, and canonical encoding."

# No `workspace = true` inheritance anywhere in this manifest: the crate must
# resolve standalone so it can be lifted into its own repository unchanged.
[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"

